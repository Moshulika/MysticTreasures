settings:
  ###########################################################################
  # 🔊 SOUNDS
  ###########################################################################
  positive-sound: "ENTITY_PLAYER_LEVELUP"
  negative-sound: "BLOCK_ANVIL_BREAK"

  ###########################################################################
  # ⚔️ PLAYER BEHAVIOR NEAR TREASURE
  ###########################################################################
  allow-pvp-near-treasure: false
  allow-flight-near-treasure: false
  allow-god-near-treasure: false
  allow-elytra-near-treasure: false

  ###########################################################################
  # 🛡️ TREASURE PROTECTION & CONDITIONS
  ###########################################################################
  disable-griefing-protection: false
  protection-radius: 50 # Radius in which grief protection works (⚠ do NOT set to 0!)
  min-players-online: 15 # Minimum players required for treasure to spawn
  protect-mobs-from-sun: true # Prevent zombies from burning in sunlight
  potion-effect-radius: 20 # Distance required to be affected by potion effects
  broadcast-to-all-worlds: false # If true → actionbar message is global (only one treasure shown if multiple exist, the one closest to the player)
  winner-cooldown: 5 # Minutes a winner must wait before claiming another treasure
  max-players-looting: 3 # Max players allowed to open treasure simultaneously (if award-method is set to CHEST)
  click-cooldown: 1 # Milliseconds cooldown between item grabs

  ###########################################################################
  # 🌐 INTEGRATIONS
  ###########################################################################
  discord-webhook-url: "" # Leave empty if unused

  ###########################################################################
  # 🎁 REWARD OBFUSCATION (Mystery Items)
  ###########################################################################
  obfuscate-rewards: false
  obfuscated-reward-item:
    item: DIRT
    name: "???"
    lore:
      - "What is this?"

  ###########################################################################
  # 🪂 FALL PROTECTION (IF FLYING IS DISABLED NEAR THE TREASURE, THE PLAYERS FLYING WILL GENTLY FALL DOWN)
  ###########################################################################
  fall-protection:
    duration: 1200 # Duration in ticks
    level: 2 # Effect level

  ###########################################################################
  # 📢 ACTIONBAR SETTINGS
  ###########################################################################
  actionbar:
    enabled: true
    refresh: 2 # Refresh rate in ticks

  ###########################################################################
  # 🚫 RESTRICTIONS
  ###########################################################################
  blacklisted-commands:
    - "heal"
  blacklisted-biomes:
    - "COLD_OCEAN"
    - "DEEP_OCEAN"
    - "DEEP_DARK"
    - "DEEP_FROZEN_OCEAN"
    - "DEEP_LUKEWARM_OCEAN"
    - "FROZEN_OCEAN"
    - "FROZEN_RIVER"
    - "ICE_SPIKES"
    - "LUKEWARM_OCEAN"
    - "OCEAN"
    - "RIVER"

  ###########################################################################
  # ✨ PARTICLE EFFECTS (Change only if compatibility issues arise)
  ###########################################################################
  effects-particles:
    dust: DUST
    wax_off: WAX_OFF
    soul: SOUL
    soul-fire-flame: SOUL_FIRE_FLAME
    warped-spore: WARPED_SPORE
    crit: CRIT
    lava: LAVA
    flame: FLAME
    treasure-spawn-particle: EXPLOSION
    treasure-fall-particle: CAMPFIRE_SIGNAL_SMOKE
    treasure-remove-particle: EXPLOSION_EMITTER

  ###########################################################################
  # ⚙️ PLUGIN OPTIONS
  ###########################################################################
  updater: true   # Enable update checker
  bstats: true    # Enable bStats metrics
