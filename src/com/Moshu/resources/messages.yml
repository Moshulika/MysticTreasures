  showcase-key-menu-title: "Treasure Key"
  active-hunts-menu:
    title: "Active Hunts"
    name: "&a&l&o{treasure_name}"
    lore:
      - ""
      - "  &a⏰ &fRemaining time: &a{time}"
      - "  &a⛨ &fTreasure Keepers: &a{keepers}"
      - "  &a➷ &fX: &a{x}&f, Y: &a{y}"
      - "  &a🗺 &fWorld: &a{world}"
      - "  &a⚔ &fParticipants: &a{participants}"
      - "  &a🔑 &fRequires key: &a{key}"
      - ""
