    title: "Hunt rewards"
    reward-item-name: "&a&l&o{reward_name}"
    reward-item-lore:
      - ""
      - "  &a⛨ &fItem: &a{item}"
      - "  &a➷ &fAmount: {amount}"
      - "  &a➷ &fChance: {chance}"
      - ""
    command-item: "COMMAND_BLOCK"
    command-item-name: "&a&l&o{reward_name}"
    command-item-lore:
      - ""
      - "  &a⛨ &fCommand: {command}"
      - "  &a➷ &fChance: {chance}"
      - ""
  showcase-keepers-menu:
    title: "Treasure Keepers"
    name: "&a&l&o{keeper_name}"
    lore:
      - ""
      - "  &a⛨ &fEntity: {entity}"
      - "  &a➷ &fMyhicMob: {mythic}"
      - "  &a➷ &fBuffed: {buffed}"
      - "  &a➷ &fRange: {range}"
      - "  &a➷ &fHealth: {health}"
      - ""
