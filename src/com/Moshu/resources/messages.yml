    - ""
    - "&6&lTreasure &e&lHunt"
    - ""
    - "&fA {alias} is rumored to appear!"
    - "&fX: &7{x} &fZ: &7{z}"
    - "&fGood luck finding it!"
    - ""
    - "&7&o((Tip: The treasure will spawn soon))"
    - ""
